<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mutialifah Sephira!</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient Background Lighting -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- Music Control Button -->
    <button id="audio-toggle" class="audio-control-btn" aria-label="Toggle background music" style="display: none;">
        <svg id="sound-on-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="sound-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
    </button>

    <!-- Welcome / Loader Section -->
    <div id="loader" class="loader">
        <canvas id="gold-dust"></canvas>
        <div class="loader-content">
            <div class="loader-badge">
                <span>Hari Spesial Mutia</span>
            </div>
            <button id="play" class="start-btn">
                <span>Buka Pesan</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <!-- Main Content Section -->
    <main id="main" class="main-content" style="display: none;">
        <canvas id="confetti"></canvas>
        
        <div class="container">
            <div class="content-wrapper">
                <header>
                    <div class="recipient-badge">Ulang Tahun ke-22</div>
                    <h1 id="name" class="recipient-name">Mutialifah Sephira</h1>
                </header>

                <div class="typing-container">
                    <div id="typed-strings">
                        <p>Happy Birthday yang ke-22!</p>
                        <p>Semoga selalu bahagia dan banyak hal baik datang ke kamu.</p>
                        <p>Semangat terus ya!</p>
                    </div>
                    <span id="typed"></span>
                </div>

                <div class="visuals">
                    <div class="cake-box">
                        <svg class="cake-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                            <!-- Cake Base Plate / Stand -->
                            <ellipse cx="60" cy="105" rx="46" ry="8" fill="#1E3A8A" opacity="0.6"/>
                            <ellipse cx="60" cy="103" rx="44" ry="6" fill="#2563EB" opacity="0.8"/>
                            
                            <!-- Bottom Layer -->
                            <rect x="25" y="68" width="70" height="30" rx="8" fill="url(#cake-bottom-grad)"/>
                            <!-- Bottom Layer Frosting Wave -->
                            <path d="M25 76 Q34 84 43 76 Q51 84 60 76 Q69 84 77 76 Q86 84 95 76 L95 68 L25 68 Z" fill="#93C5FD"/>
                            
                            <!-- Middle Layer -->
                            <rect x="36" y="44" width="48" height="24" rx="7" fill="url(#cake-top-grad)"/>
                            <!-- Middle Layer Frosting Wave -->
                            <path d="M36 51 Q44 57 52 51 Q60 57 68 51 Q76 57 84 51 L84 44 L36 44 Z" fill="#BFDBFE"/>
                            
                            <!-- Cake Candle (Center) -->
                            <rect x="58" y="28" width="4" height="16" rx="2" fill="#FFFFFF"/>
                            <path d="M58 32 L62 30" stroke="#60A5FA" stroke-width="1.2"/>
                            <path d="M58 37 L62 35" stroke="#60A5FA" stroke-width="1.2"/>

                            <!-- Candle Wick -->
                            <line x1="60" y1="28" x2="60" y2="24" stroke="#CBD5E1" stroke-width="1.5"/>

                            <!-- Glowing Animated Flame -->
                            <path d="M60 14 Q65 19 60 24 Q55 19 60 14 Z" fill="#FBBF24">
                                <animate attributeName="d" 
                                    values="M60 14 Q65 19 60 24 Q55 19 60 14 Z; M60 12 Q66 18 60 24 Q54 18 60 12 Z; M60 14 Q65 19 60 24 Q55 19 60 14 Z" 
                                    dur="1.2s" repeatCount="indefinite" />
                            </path>
                            <circle cx="60" cy="19" r="2" fill="#FDE68A">
                                <animate attributeName="r" values="2; 3.2; 2" dur="1.2s" repeatCount="indefinite" />
                                <animate attributeName="opacity" values="1; 0.6; 1" dur="1.2s" repeatCount="indefinite" />
                            </circle>

                            <!-- Side Candles (Left & Right) -->
                            <rect x="44" y="32" width="3.5" height="12" rx="1.5" fill="#E2E8F0"/>
                            <path d="M45.75 22 Q49 26 45.75 30 Q42.5 26 45.75 22 Z" fill="#F59E0B">
                                <animate attributeName="opacity" values="0.8; 1; 0.8" dur="1.5s" repeatCount="indefinite" />
                            </path>
                            
                            <rect x="72.5" y="32" width="3.5" height="12" rx="1.5" fill="#E2E8F0"/>
                            <path d="M74.25 22 Q77.5 26 74.25 30 Q71 26 74.25 22 Z" fill="#F59E0B">
                                <animate attributeName="opacity" values="1; 0.7; 1" dur="1.4s" repeatCount="indefinite" />
                            </path>

                            <!-- Sparkles / Little Stars -->
                            <circle cx="24" cy="38" r="1.5" fill="#FDE68A">
                                <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2s" repeatCount="indefinite" />
                            </circle>
                            <circle cx="96" cy="40" r="1.5" fill="#93C5FD">
                                <animate attributeName="opacity" values="1; 0.2; 1" dur="1.8s" repeatCount="indefinite" />
                            </circle>
                            <circle cx="60" cy="8" r="1.8" fill="#FBBF24">
                                <animate attributeName="opacity" values="0.3; 1; 0.3" dur="1.3s" repeatCount="indefinite" />
                            </circle>

                            <!-- Gradients -->
                            <defs>
                                <linearGradient id="cake-bottom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#1D4ED8"/>
                                    <stop offset="100%" stop-color="#3B82F6"/>
                                </linearGradient>
                                <linearGradient id="cake-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#2563EB"/>
                                    <stop offset="100%" stop-color="#60A5FA"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                </div>

                <footer>
                    <a href="letter.html" class="letter-btn">
                        <span>Baca Surat</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </a>
                </footer>
            </div>
        </div>
    </main>

    <audio id="song" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script src="js/jquery.js"></script>
    <script src="js/typed.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
